name: terraform
on:
  pull_request:
    paths:
      - "pipeline-demo/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "pipeline-demo/**"
      - ".github/workflows/**"
permissions:
  id-token: write
  contents: read
  pull-requests: write
defaults:
  run:
    working-directory: pipeline-demo
jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::829999272172:role/GitHubActionsTerraformRole
          aws-region: eu-central-1
          role-session-name: GitHubActions-Terraform-Plan
          role-skip-session-tagging: true
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -out=tfplan
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::829999272172:role/GitHubActionsTerraformRole
          aws-region: eu-central-1
          role-session-name: GitHubActions-Terraform-Apply
          role-skip-session-tagging: true
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform apply -auto-approve
  debug-oidc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/github-script@v6
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64').toString())
            console.log("=== OIDC PAYLOAD ===")
            console.log(JSON.stringify(payload, null, 2))
            console.log("=== SUB ===", payload.sub)
            console.log("=== AUD ===", payload.aud)
            console.log("=== JOB_WORKFLOW_REF ===", payload.job_workflow_ref)
